<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oświadczenie Marketingowe DEKRA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Oświadczenie Marketingowe DEKRA</h1>
        <form id="dekraForm">
            <label for="name">Imię i nazwisko*:</label>
            <input type="text" id="name" name="name" required>

            <label for="company">Nazwa firmy:</label>
            <input type="text" id="company" name="company">

            <label for="region">Województwo*:</label>
            <input type="text" id="region" name="region" required>

            <label for="nip">NIP:</label>
            <input type="text" id="nip" name="nip">

            <label for="industry">Branża*:</label>
            <input type="text" id="industry" name="industry" required>

            <label for="phone">Telefon:</label>
            <input type="text" id="phone" name="phone">

            <label for="email">E-mail*:</label>
            <input type="email" id="email" name="email" required>

            <h3>Voucher</h3>
            <input type="checkbox" id="voucher" name="voucher">
            <label for="voucher">Jestem zainteresowany/a otrzymaniem vouchera upoważniającego do 10% rabatu na szkolenie.</label>

            <h3>Tematyka</h3>
            <p>Jestem zainteresowany/a otrzymywaniem bezpłatnych newsletterów informacji DEKRA:</p>
            <input type="checkbox" id="all_topics" name="topics" value="all">
            <label for="all_topics">WSZYSTKIE tematy</label><br>
            <input type="checkbox" id="topic1" name="topics" value="ISO 9001, ISO 14001, ISO 45001, EMAS, ISO 50001">
            <label for="topic1">ISO 9001, ISO 14001, ISO 45001, EMAS, ISO 50001</label><br>
            <input type="checkbox" id="topic2" name="topics" value="ISO/IEC 27001, ISO 22301, ISO 20000-1">
            <label for="topic2">ISO/IEC 27001, ISO 22301, ISO 20000-1</label><br>
            <input type="checkbox" id="topic3" name="topics" value="Zarządzanie kryzysowe, ciągłość działania">
            <label for="topic3">Zarządzanie kryzysowe, ciągłość działania</label><br>
            <input type="checkbox" id="topic4" name="topics" value="Bezpieczeństwo żywności, pasz, opakowań">
            <label for="topic4">Bezpieczeństwo żywności, pasz, opakowań</label><br>
            <input type="checkbox" id="topic5" name="topics" value="Zarządzanie bezpieczeństwem informacji, BCM">
            <label for="topic5">Zarządzanie bezpieczeństwem informacji, BCM</label><br>
            <input type="checkbox" id="topic6" name="topics" value="Inne tematy z zakresu systemów zarządzania">
            <label for="topic6">Inne tematy z zakresu systemów zarządzania</label>

            <h3>Oświadczenia</h3>
            <input type="checkbox" id="statement1" name="statement1" required>
            <label for="statement1">* Potwierdzam zapoznanie się z Obowiązkiem informacyjnym.</label><br>
            <input type="checkbox" id="statement2" name="statement2" required>
            <label for="statement2">* Wyrażam zgodę na przetwarzanie danych przez DEKRA Polska sp. z o.o.</label>

            <button type="submit">Wyślij</button>
        </form>
        <p id="message"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
